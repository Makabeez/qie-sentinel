name: Agent Python and public site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and unit tests
        run: |
          python3 -m compileall -q sentinel-agent
          python3 -m unittest discover -s sentinel-agent -p 'test_*.py' -v
      - name: Validate public site assets and security policy
        run: python3 scripts/check-public-site.py
