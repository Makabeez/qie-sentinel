[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
